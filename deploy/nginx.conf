# Voxit 生产部署 nginx 配置示例
# 用法：
#   1. 修改 server_name / 路径为你的实际域名
#   2. 前端构建产物：apps/web/dist
#   3. 后端 API：反向代理到 http://127.0.0.1:3100
#   4. 放入 /etc/nginx/sites-available/ 并软链到 sites-enabled，nginx -t && systemctl reload nginx
#
# 注意：
#   - 登录接口/API 由后端鉴权（JWT），无需在 nginx 层配置 auth
#   - SSE（批量合成/导出进度）需要关闭 proxy_buffering
#   - 生产环境建议启用 HTTPS（证书用 certbot 免费签发，见 README）

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或服务器 IP

    # 前端静态资源（React 构建产物）
    root /var/www/voxit/web;       # 即 apps/web/dist 的内容
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 前端路由（react-router 的 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式进度（批量合成 / 导出）必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 长文本合成可能超过默认 60s
    }
}
